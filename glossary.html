/* عرض احتياطي: يعرض الجدول حتى لو لم يعمل lang.js */
setTimeout(function() {
  var container = document.getElementById('content');
  if (!container) return;
  if (container.innerHTML.trim() !== '') return;
  if (typeof window.sections === 'undefined') return;

  var rows = '';
  window.sections.forEach(function(sec) {
    sec.items.forEach(function(it) {
      rows += '<tr>' +
        '<td class="en">' + it[0] + '</td>' +
        '<td class="ar">' + it[1] + '</td>' +
        '<td class="zh" style="font-family:system-ui,sans-serif;">' + it[2] + '</td>' +
        '<td class="cat" style="color:#6f95bd;font-size:0.82rem;font-style:italic;">' + sec.title + '</td>' +
      '</tr>';
    });
  });

  var html = '<div class="table-wrap"><table>' +
    '<thead><tr>' +
      '<th>الإنجليزي</th><th>العربي</th><th>الصيني</th><th>القسم</th>' +
    '</tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
  '</table></div>';

  container.innerHTML = html;
}, 500);
</script>
